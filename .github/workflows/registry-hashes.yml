name: Check registry hashes

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'models/registry.yml'
      - 'docs/check-registry-hashes*.mjs'
      - 'docs/package.json'
      - '.github/workflows/registry-hashes.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install registry tooling dependencies
        working-directory: docs
        run: npm install
      - name: Test registry checker
        run: node --test docs/check-registry-hashes.test.mjs
      - name: Verify all upstream hashes and sizes
        run: node docs/check-registry-hashes.mjs