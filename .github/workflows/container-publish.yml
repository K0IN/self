name: Build and publish containers

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-publish:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda-13
            base_variant: cuda-13
            engine_variant: cuda-13.4
          - variant: cuda-12
            base_variant: cuda-12
            engine_variant: cuda-12.8
          - variant: cpu
            base_variant: cpu
            engine_variant: cpu

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake curl libvulkan1 mesa-vulkan-drivers ninja-build
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin --tag 1.43.0

      - name: Install CUDA Toolkit
        if: startsWith(matrix.engine_variant, 'cuda-')
        env:
          ENGINE_VARIANT: ${{ matrix.engine_variant }}
        run: |
          curl --fail --location --output /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          cuda_version="${ENGINE_VARIANT#cuda-}"
          sudo apt-get install -y --no-install-recommends "cuda-toolkit-${cuda_version//./-}"
          "/usr/local/${ENGINE_VARIANT}/bin/nvcc" --version

      - name: Build server and engines
        env:
          LLAMA_CPP_TAG: b11256
          ENGINE_VARIANT: ${{ matrix.engine_variant }}
          LAYA_VARIANT: vulkan
        run: |
          go test ./...
          just --unstable setup
          just --unstable engine verify ../bin/libexec/ai-server "${{ matrix.engine_variant }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant }}-${{ github.sha }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.variant == 'cuda-13' }}
            type=semver,pattern=${{ matrix.variant }}-{{version}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            CUDA_VARIANT=${{ matrix.base_variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
