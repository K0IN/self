# self model registry.
#
# Public, human-edited list of the models `self` can serve. Every entry:
#
#   <name>:<version-size>:
#     description:   one line (shown by `self ls-remote` and on the overview page)
#     readme:        model card, Markdown file relative to this file (readmes/<name>/<version-size>.md)
#     type:          decision | audio | text | embedding | image
#     default:       quant used when --quant is not given
#     capabilities:  text | vision | multi-image | choice | score | noul | audio | embedding | image | image-edit
#     info:          descriptive metadata (family, parameters, architecture,
#                    base_model, source, license, languages, context_length,
#                    max_options, homepage). max_options also caps requests.
#     settings:      engine parameters for the adapter, e.g. context_size,
#                    threads, temperature (see dev-docs/11-onboarding.md). Can be
#                    overridden per quant (`settings:` under the quant) and
#                    at run time with `self serve <id> --set key=value`.
#     <quant>:
#       adapter:     engine adapter (ggmlc-laya | ggmlc-custom-decider | ggmlc-audio | llama-server | sd-server)
#       repo:        Hugging Face repo (owner/name)
#       files:       - {file, size, sha256[, role: model|mmproj|voice][, repo]}
#                    role voice (audio only): .wav/.mp3 reference voice used
#                    when a request has none. repo: per-file repo override.
#                    role mmproj (text and decision): vision projector.
#       settings:    optional per-quant settings (override the model's)
#
# size (bytes) and sha256 pin the exact upstream file. A download that does
# not match is deleted and never used; if the upstream file changes, `self`
# refuses to download it until this file is updated.
#
# Image pipelines keep diffusion weights in GGUF. Image-only vae and
# text-encoder roles also accept safetensors; mmproj remains GGUF.
